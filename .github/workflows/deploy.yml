# Production deployment to Cloudflare Workers.
#
# Deployment is OFF until you opt in. The verify job always runs on main, so the
# code stays continuously checked while the site is unhosted; the deploy job is
# skipped (not failed) unless you enable it.
#
# To go live:
#   1. Add repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
#   2. Add repository variable DEPLOY_ENABLED = true
#      (Settings → Secrets and variables → Actions → Variables)
#   3. Push to main, or run this workflow manually
#
# A manual run deploys regardless of the variable, so you can do a one-off
# deployment without switching automatic deploys on permanently.
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One deployment at a time; never cancel a run that is mid-deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    name: Deploy to Cloudflare Workers
    needs: verify
    if: vars.DEPLOY_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://devpatel-portfolio.devpatel1286.workers.dev

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Confirm Cloudflare credentials are present
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$API_TOKEN" ] || [ -z "$ACCOUNT_ID" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets before deploying."
            exit 1
          fi

      # Worker secrets are managed out of band (wrangler secret put / dashboard)
      # so a missing GitHub secret can never blank one out on deploy.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment health
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              https://devpatel-portfolio.devpatel1286.workers.dev/api/health || echo 000)
            echo "attempt $attempt: /api/health -> $status"
            # 503 means a binding is unconfigured, not that the deploy failed.
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Worker did not respond after deployment"
          exit 1
